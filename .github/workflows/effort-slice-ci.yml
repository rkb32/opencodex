name: effort-slice-ci

on:
  push:
    branches-ignore:
      - main
    paths:
      - "effort-slice/**"
      - ".github/workflows/effort-slice-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: effort-slice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
